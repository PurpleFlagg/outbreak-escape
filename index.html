<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outbreak: IT Room, a Zombie IT Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e9e3; --surface:#fbfbf8; --ink:#1d2420; --muted:#55605a; --line:#cdd3ca;
  --accent:#a3261a; --on-accent:#ffffff; --focus:#d39a00; --chip:#e0e4db;
  --bad-ink:#a3261a; --good-ink:#1f6b3a; --title:#3d5a2c;
  --rack:#1b2321; --rack-edge:#0e1312; --bay:#26302d; --rack-ink:#e3ebe5; --rack-muted:#98a69e;
  --led-red:#ff4d3d; --led-amber:#f2c230; --led-green:#62e08a;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101715; --surface:#19221f; --ink:#e4ebe5; --muted:#9aa89f; --line:#2b3732;
    --accent:#ff5a43; --on-accent:#1a0805; --focus:#f2c230; --chip:#22302a;
    --bad-ink:#ff8a78; --good-ink:#7ee6a0; --title:#9fcf7c;
    --rack:#0b100e; --rack-edge:#040706; --bay:#18201d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#19221f; --ink:#e4ebe5; --muted:#9aa89f; --line:#2b3732;
  --accent:#ff5a43; --on-accent:#1a0805; --focus:#f2c230; --chip:#22302a;
  --bad-ink:#ff8a78; --good-ink:#7ee6a0; --title:#9fcf7c;
  --rack:#0b100e; --rack-edge:#040706; --bay:#18201d;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:clamp(17px,0.9vw + 12px,22px);line-height:1.5;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rack)}
h1,.creep{font-family:"Creepster","Chakra Petch",fantasy,sans-serif;font-weight:400}
h2,.btn,.clock,.bay-label,.bay-num,.display{font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif}
h1{font-size:clamp(3rem,8vw,6rem);line-height:.95;margin:.2em 0 .25em;color:var(--title);letter-spacing:.02em}
h2{font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.15;margin:.1em 0 .4em}
p{margin:0 0 1em;max-width:64ch}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn{font-weight:700;padding:.6em 1.2em;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,36px)}
.tape{height:16px;background:repeating-linear-gradient(-45deg,#f2c230 0 18px,#161a18 18px 36px)}

/* Scene */
.scene-box{background:#0c0f0e;border-radius:10px;overflow:hidden;border:3px solid var(--rack-edge);perspective:900px;--tx:0;--ty:0}
.scene{display:block;width:100%;height:clamp(200px,30vw,340px);transform:scale(1.06) rotateY(calc(var(--tx) * 2.5deg)) rotateX(calc(var(--ty) * -2deg));transition:transform .25s ease-out}
.scene .c1,.scene .c2,.scene .c3,.scene .hole,.scene .hand,.scene .eyes{opacity:0;transition:opacity .8s}
.l1 .c1,.l1 .eyes{opacity:1}
.l2 .c2,.l2 .h1{opacity:1}
.l3 .c3,.l3 .h2{opacity:1}
.l4 .hole,.l4 .hand{opacity:1}
.leak{opacity:.25;transition:opacity 1s}
.l1 .leak{opacity:.45}.l2 .leak{opacity:.7}.l3 .leak{opacity:1}
.grab{transform-box:fill-box;transform-origin:50% 100%;animation:grab 1.4s ease-in-out infinite}
.h2 .grab{animation-delay:.5s}
@keyframes grab{0%,100%{transform:rotate(-7deg) translateY(0) scale(1)}50%{transform:rotate(8deg) translateY(-5px) scale(1.06)}}
.shuffle{animation:shuffle 6s ease-in-out infinite}
.shuffle.s2{animation-duration:8.5s;animation-delay:-3s}
@keyframes shuffle{0%,100%{transform:translateX(-14px)}50%{transform:translateX(16px)}}
.eyes circle{animation:blinkeye 4s infinite}
@keyframes blinkeye{0%,92%,100%{opacity:1}95%{opacity:0}}
.swing{transform-box:view-box;transform-origin:400px 0px;animation:swing 4.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.mote{animation:mote 9s linear infinite}
.mote:nth-child(2){animation-delay:-2s}.mote:nth-child(3){animation-delay:-4s}.mote:nth-child(4){animation-delay:-6s}.mote:nth-child(5){animation-delay:-7.5s}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(18px,-60px);opacity:0}}
.door-g{transform-box:fill-box;transform-origin:50% 60%}
.l2 .shake{animation:shake 1.8s infinite}
.l3 .shake{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1.5px,0)}80%{transform:translate(1.5px,1px)}}
.alarm{opacity:0}
.l3 .alarm{animation:alarm 1s infinite}
@keyframes alarm{0%,100%{opacity:0}50%{opacity:.22}}
.flicker{opacity:0}
.l3 .flicker{animation:flicker 3.1s infinite}
@keyframes flicker{0%,88%,100%{opacity:0}90%{opacity:.75}92%{opacity:.1}94%{opacity:.6}}
.surge .door-g{animation:bulge .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bulge{0%{transform:scale(1)}30%{transform:scale(1.07) translateY(-2px)}60%{transform:scale(.98)}100%{transform:scale(1)}}
.flash,.dust{opacity:0}
.surge .flash{animation:flash .6s}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.surge .dust{animation:dust 1.1s ease-in forwards}
.surge .dust:nth-child(2n){animation-duration:1.4s}.surge .dust:nth-child(3n){animation-duration:.9s}
@keyframes dust{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(6px,200px)}}

/* Rack */
.rack{background:var(--rack);border:3px solid var(--rack-edge);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;color:var(--rack-ink)}
.bay{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:3px;position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.04) 6px 8px),var(--bay);border:1px solid rgba(255,255,255,.06)}
.bay-num{font-weight:700;color:var(--rack-muted);width:1.2em}
.bay-label{font-weight:600;font-size:.92em}
.led{width:14px;height:14px;border-radius:50%;flex:none;background:var(--led-red);box-shadow:0 0 10px var(--led-red)}
.bay.active{outline:2px solid var(--led-amber);outline-offset:-2px}
.bay.active .led{background:var(--led-amber);box-shadow:0 0 12px var(--led-amber);animation:blink 1s steps(2,start) infinite}
.bay.done .led{background:var(--led-green);box-shadow:0 0 12px var(--led-green)}
@keyframes blink{50%{opacity:.25}}
.rack-title{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;color:var(--rack-muted);margin:2px 4px 4px}
.sr{position:absolute;left:-9999px}

/* Intro */
.intro{max-width:980px;margin:0 auto}
.intro .lede{font-size:1.2em}
.setup{display:grid;gap:16px;margin-top:1.2em;max-width:520px}
.setup label{display:grid;gap:6px;font-weight:700}
.setup input{padding:.6em .8em;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.rules{display:grid;gap:6px;margin:0 0 1em;padding-left:1.2em}

/* Game */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rack);color:var(--rack-ink);
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(16px,3vw,36px);flex-wrap:wrap}
.clock{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--led-amber)}
.clock.low{color:var(--led-red)}
.bar .team{font-weight:700}
.bar .hc{color:var(--rack-muted)}
.game{display:grid;grid-template-columns:270px 1fr;gap:clamp(16px,3vw,32px);align-items:start;margin-top:clamp(16px,2.5vw,28px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,36px)}
.lock-of{color:var(--muted);font-weight:700;margin:0}
.story{color:var(--muted)}
.feedback{min-height:1.6em;font-weight:700;margin:1em 0 .5em}
.feedback.bad{color:var(--bad-ink)}
.feedback.good{color:var(--good-ink)}
.hints{border-top:1px dashed var(--line);margin-top:1em;padding-top:1em}
.hints ul{margin:.8em 0 0;padding-left:1.2em}
.hints li{margin-bottom:.4em;max-width:64ch}

/* Quiz selects */
.quiz{padding-left:1.4em;display:grid;gap:16px;margin:0 0 1.2em}
.quiz label{display:grid;gap:6px}
.quiz select{padding:.45em .6em;border-radius:8px;border:2px solid var(--line);background:var(--surface);max-width:100%;width:min(100%,560px)}

/* Pairing */
.match{display:grid;grid-template-columns:1fr 2fr;gap:18px;margin-bottom:1.2em}
.match h3{font-family:"Chakra Petch",system-ui,sans-serif;font-size:1em;margin:0 0 8px;color:var(--muted)}
.col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;padding:.6em .8em;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:center}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.port{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;font-size:1.15em}
.badge{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;min-width:1.8em;height:1.8em;border-radius:6px;display:inline-grid;place-items:center;background:var(--chip);color:var(--accent);flex:none}
.badge.empty{color:var(--muted)}

/* Binary */
.radio-msg{background:#161c1a;color:#9fe6a9;font-family:"Chakra Petch",ui-monospace,monospace;font-weight:600;border-radius:8px;padding:16px 18px;margin:.2em 0 1.2em;border:2px solid #2d3a35;overflow-x:auto}
.radio-msg small{display:block;color:#7c8a83;font-weight:500;margin-bottom:6px}
.radio-msg .bits{font-size:clamp(1.05rem,2.6vw,1.9rem);white-space:nowrap;letter-spacing:.04em}
.decoder{border:2px dashed var(--line);border-radius:10px;padding:14px 16px;margin-bottom:1.4em;overflow-x:auto}
.decoder p{margin:0 0 .6em}
.bitrow{display:flex;gap:8px;align-items:end}
.bit{display:grid;gap:4px;justify-items:center}
.bit small{color:var(--muted);font-weight:700;font-size:.8em}
.bit button{width:2.3em;height:2.3em;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;cursor:pointer}
.bit button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.eq{font-family:"Chakra Petch",system-ui,sans-serif;font-size:1.5em;font-weight:700;margin-left:6px;white-space:nowrap}
.keypad{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.keypad input{width:11em;max-width:100%;padding:.45em .6em;font-family:"Chakra Petch",system-ui,sans-serif;font-size:1.3em;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--surface)}

/* Win / overlay */
.end{max-width:900px;margin:0 auto;text-align:left}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:1em 0 1.6em}
.stats div{display:grid}
.stats b{font-family:"Chakra Petch",system-ui,sans-serif;font-size:2em;line-height:1.1}
.stats span{color:var(--muted)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#2a0705 72%,transparent);display:grid;place-items:center;z-index:20;padding:20px}
.overlay .panel{max-width:540px}
.overlay h2{font-family:"Creepster","Chakra Petch",fantasy,sans-serif;font-weight:400;font-size:clamp(2.4rem,6vw,3.6rem);color:var(--accent);margin:0 0 .2em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.host{margin-top:28px}
.host summary{cursor:pointer;font-weight:700}
.host ol{padding-left:1.3em}

@media (max-width:760px){
  .game{grid-template-columns:1fr}
  .rack{flex-direction:row}
  .rack-title{display:none}
  .bay{flex:1;justify-content:center;padding:10px 4px}
  .bay-label{display:none}
  .match{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  .grab,.eyes circle,.l2 .shake,.l3 .shake,.l3 .alarm,.l3 .flicker,.surge .door-g,.surge .dust,.swing,.shuffle,.mote,.bay.active .led{animation:none}
  .scene{transform:none}
  .l3 .alarm{opacity:.18}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const DURATION = 600, WRONG_COST = 15, HINT_COST = 60;
const state = { team:'', elapsed:0, penalty:0, idx:0, solved:[], hintsUsed:0, wrong:0, hintsShown:{}, timer:null, paused:false, clockOff:false };

/* ---------- The door ---------- */
function sceneSvg(){
  const hand = cls => `<g class="hand ${cls}"><g class="grab" filter="url(#soft)">
    <path d="M-12 46 L-15 18 Q-16 4 -6 2 L8 2 Q17 5 15 18 L13 46 Z" fill="url(#skin)"/>
    <path d="M-13 30 L13 30 L13 46 L-12 46 Z" fill="#3b2f33" opacity=".85"/>
    <path d="M-14 31 L-9 27 L-4 32 L2 27 L7 32 L13 28" stroke="#22191c" stroke-width="1.5" fill="none"/>
    <path d="M-10 6 L-15 -18 M-3 3 L-5 -27 M4 3 L5 -26 M11 6 L17 -16" stroke="url(#skin)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-13 14 L-25 4" stroke="#7d9867" stroke-width="7" stroke-linecap="round"/>
    <path d="M-15 -16 l-1 -3 M-5 -25 l0 -3 M5 -24 l0 -3 M17 -14 l1 -3" stroke="#d8d0a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-12 -6 l5 0 M-5 -12 l5 0 M3 -12 l5 0 M11 -4 l5 0 M-6 16 Q0 20 7 14" stroke="#4e623f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g></g>`;
  const motes = [[380,120],[420,160],[360,210],[440,240],[400,280]].map(([x,y])=>`<circle class="mote" cx="${x}" cy="${y}" r="1.6" fill="#f6e7a8"/>`).join('');
  const dust = [[320,74],[350,72],[372,76],[398,72],[426,75],[452,73],[478,76],[340,78],[466,78]].map(([x,y])=>`<circle class="dust" cx="${x}" cy="${y}" r="${(x%3)+1.5}" fill="#b9a68a"/>`).join('');
  return `<svg class="scene" viewBox="-200 0 1200 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A dark hallway with a barricaded door. Cracks spread, red light leaks through, and zombie hands punch through as time runs out.">
  <defs>
    <pattern id="hz" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="20" fill="#f2c230"/><rect x="10" width="10" height="20" fill="#161a18"/></pattern>
    <pattern id="brick" width="48" height="22" patternUnits="userSpaceOnUse"><rect width="48" height="22" fill="#3a2c27"/><rect x="1" y="1" width="46" height="9" fill="#46342d"/><rect x="-23" y="12" width="46" height="9" fill="#413029"/><rect x="25" y="12" width="46" height="9" fill="#493730"/></pattern>
    <linearGradient id="wallL" x1="0" x2="1"><stop offset="0" stop-color="#0d0f0f"/><stop offset="1" stop-color="#2a2422"/></linearGradient>
    <linearGradient id="wallR" x1="1" x2="0"><stop offset="0" stop-color="#0d0f0f"/><stop offset="1" stop-color="#2a2422"/></linearGradient>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070808"/><stop offset="1" stop-color="#1c1918"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262321"/><stop offset="1" stop-color="#0b0c0c"/></linearGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#4a3624"/><stop offset=".5" stop-color="#6b4f35"/><stop offset="1" stop-color="#4f3a27"/></linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a58257"/><stop offset=".5" stop-color="#8a6a45"/><stop offset="1" stop-color="#5f472d"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa3a0"/><stop offset="1" stop-color="#3c4341"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db585"/><stop offset="1" stop-color="#5f7a4f"/></linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".28"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".35"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="redglow"><stop offset="0" stop-color="#ff3b22" stop-opacity=".9"/><stop offset="1" stop-color="#ff3b22" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="win"><rect x="352" y="100" width="96" height="40" rx="2"/></clipPath>
  </defs>
  <g class="room">
    <polygon points="-200,0 1000,0 700,44 100,44" fill="url(#ceil)"/>
    <polygon points="-200,0 100,44 100,292 -200,340" fill="url(#wallL)"/>
    <polygon points="1000,0 700,44 700,292 1000,340" fill="url(#wallR)"/>
    <polygon points="-200,340 100,292 700,292 1000,340" fill="url(#floor)"/>
    <path d="M100 292 L-120 340 M200 292 L100 340 M300 292 L270 340 M400 292 L400 340 M500 292 L530 340 M600 292 L700 340 M700 292 L920 340 M30 303 H770 M-60 318 H860" stroke="#0a0b0b" stroke-width="1.5" opacity=".7"/>
    <rect x="100" y="44" width="600" height="248" fill="url(#brick)"/>
    <rect x="100" y="44" width="600" height="248" fill="#0b0909" opacity=".35"/>
    <path d="M100 54 H700" stroke="#2b2f2e" stroke-width="7"/><path d="M100 52 H700" stroke="#4b5250" stroke-width="2"/>
    <polygon points="760,70 860,52 860,104 760,112" fill="#151918" stroke="#3c4341" stroke-width="3"/>
    <path d="M770 80 L850 66 M770 88 L850 75 M770 96 L850 84 M770 104 L850 93" stroke="#3c4341" stroke-width="3"/>
    <rect x="-40" y="120" width="70" height="44" rx="3" fill="#1d2120" stroke="#3a403e" stroke-width="2" transform="skewY(8)"/>
    <ellipse class="leak" cx="400" cy="292" rx="120" ry="10" fill="url(#redglow)"/>
    <g class="jolt"><g class="shake"><g class="door-g">
      <rect x="292" y="66" width="216" height="226" fill="#1a1412"/>
      <polygon points="292,66 304,78 304,292 292,292" fill="#2e2420"/>
      <polygon points="508,66 496,78 496,292 508,292" fill="#120d0b"/>
      <polygon points="292,66 508,66 496,78 304,78" fill="#0e0a09"/>
      <rect x="304" y="78" width="192" height="214" fill="url(#wood)"/>
      <path d="M342 78 V292 M380 78 V292 M418 78 V292 M458 78 V292" stroke="#2f2216" stroke-width="2.5"/>
      <path d="M318 90 q6 40 0 80 q-5 40 2 110 M360 84 q-5 60 2 120 q4 40 -2 86 M400 90 q6 50 0 100 q-6 50 1 100 M440 86 q-4 60 2 110 q5 50 -2 90 M478 90 q5 50 -1 100 q-4 50 1 96" stroke="#2f2216" stroke-width="1" fill="none" opacity=".45"/>

function bindTilt(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || window.__tiltBound) return;
  window.__tiltBound = true;
  const set = (x, y) => { const b = $('.scene-box'); if (!b) return; b.style.setProperty('--tx', x.toFixed(3)); b.style.setProperty('--ty', y.toFixed(3)); };
  window.addEventListener('pointermove', e => set((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1), { passive:true });
  window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; set(Math.max(-1, Math.min(1, e.gamma / 25)), Math.max(-1, Math.min(1, (e.beta - 45) / 25))); }, { passive:true });
}
function level(){
  if (state.clockOff) return 4;
  const used = (state.elapsed + state.penalty) / DURATION;
  return used >= 1 ? 4 : used >= .9 ? 3 : used >= .6 ? 2 : used >= .3 ? 1 : 0;
}
function applyLevel(l = level()){
  const box = $('.scene-box'); if (!box) return;
  for (let i = 1; i <= 4; i++) box.classList.toggle('l' + i, l >= i);
}
function surge(){
  const box = $('.scene-box'); if (!box) return;
  box.classList.remove('surge'); void box.offsetWidth; box.classList.add('surge');
  setTimeout(() => box.classList.remove('surge'), 600);
}

function quizHtml(qs){
  return `<ol class="quiz">${qs.map((q,i)=>`
    <li><label><span>${q.q}</span>
      <select data-i="${i}" aria-label="Answer for question ${i+1}">
        <option value="">Choose an answer</option>${q.opts.map(o=>`<option>${esc(o)}</option>`).join('')}
      </select></label></li>`).join('')}</ol>
    <button class="btn" id="check">Lock in answers</button>`;
}
function quizBind(qs){
  $('#check').onclick = () => {
    const sels = $$('.quiz select');
    if (sels.some(s => !s.value)) return fb('Answer every question first.', 'bad');
    const n = sels.filter((s,i) => s.value === qs[i].a).length;
    n === sels.length ? solve() : wrong(`${n} of ${sels.length} are right. The zombies surge!`);
  };
}

/* ---------- Helpers ---------- */
function fb(msg, kind){ const el = $('#fb'); if (!el) return; el.textContent = msg; el.className = 'feedback ' + (kind || ''); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function remaining(){ return DURATION - state.elapsed - state.penalty; }
function clockText(){ return state.clockOff ? fmt(state.elapsed + state.penalty) : fmt(remaining()); }
function refreshClock(){
  const c = $('#clock'); if (!c) return;
  c.textContent = clockText(); c.classList.toggle('low', !state.clockOff && remaining() <= 60);
  applyLevel();
}
function wrong(msg){
  state.wrong++;
  if (!state.clockOff) state.penalty += WRONG_COST;
  fb(msg + (state.clockOff ? '' : ` (−${WRONG_COST} seconds)`), 'bad');
  surge(); refreshClock();
  if (!state.clockOff && remaining() <= 0) timeUp();
}

function startTimer(){
  stopTimer();
  state.timer = setInterval(() => {
    if (state.paused) return;
    state.elapsed++;
    refreshClock();
    if (!state.clockOff && remaining() <= 0) timeUp();
  }, 1000);
}
function stopTimer(){ if (state.timer) clearInterval(state.timer); state.timer = null; }

function rackHtml(){
  return `<p class="rack-title">Escape route</p>` + PUZZLES.map((q,i)=>`<div class="bay ${state.solved[i]?'done':''} ${i===state.idx && !state.solved[i]?'active':''}">
    <span class="led" aria-hidden="true"></span><span class="bay-num">${i+1}</span><span class="bay-label">${q.short}</span>
    <span class="sr">${state.solved[i]?'unlocked':(i===state.idx?'current lock':'locked')}</span></div>`).join('');
}
function hintsHtml(){
  const p = PUZZLES[state.idx], shown = state.hintsShown[state.idx] || 0;
  const cost = state.clockOff ? '' : ' (costs 1 minute)';
  return `${shown < p.hints.length ? `<button class="btn ghost" id="hint">Get a hint${cost}</button>` : '<p style="margin:0;color:var(--muted)">No more hints for this lock.</p>'}
    ${shown ? `<ul>${p.hints.slice(0,shown).map(h=>`<li>${h}</li>`).join('')}</ul>` : ''}`;
}
function bindHints(){
  const b = $('#hint'); if (!b) return;
  b.onclick = () => {
    state.hintsShown[state.idx] = (state.hintsShown[state.idx] || 0) + 1;
    state.hintsUsed++;
    if (!state.clockOff) state.penalty += HINT_COST;
    $('#hc').textContent = state.hintsUsed;
    refreshClock();
    $('#hints').innerHTML = hintsHtml(); bindHints();
    if (!state.clockOff && remaining() <= 0) timeUp();
  };
}
function hostHtml(){
  if (location.hash !== '#host') return '';
  return `<details class="host panel"><summary>Host answer key</summary><ol>${PUZZLES.map(p=>`<li><strong>${p.title}:</strong> ${p.key}</li>`).join('')}</ol></details>`;
}

/* ---------- Screens ---------- */
function renderIntro(){
  stopTimer();
  Object.assign(state, { elapsed:0, penalty:0, idx:0, solved:[], hintsUsed:0, wrong:0, hintsShown:{}, paused:false, clockOff:false });
  app.innerHTML = `<div class="tape" aria-hidden="true"></div>
  <div class="wrap"><section class="intro">
    <div class="scene-box l1">${sceneSvg()}</div>
    <h1>Outbreak: IT Room</h1>
    <p class="lede">A zombie outbreak just hit the school. You’re barricaded in the IT room, and they’re already clawing at the door. Crack five locks to escape through the vents before the barricade gives out.</p>
    <ul class="rules">
      <li>These locks are tougher: hardware diagnosis, port numbers, help desk tickets, binary IP addresses, and attack types.</li>
      <li>Wrong answers make the zombies surge, costing ${WRONG_COST} seconds. Hints cost a full minute.</li>
      <li>Play solo or work together as a team.</li>
    </ul>
    <div class="setup">
      <label>Team or player name <input type="text" id="team" maxlength="30" placeholder="The Last Admins" value="${esc(state.team)}"></label>

      <div><button class="btn" id="start">Start the clock</button></div>
    </div>
  </section>
  ${hostHtml()}</div>`;
  $('#start').onclick = () => { state.team = $('#team').value.trim(); renderGame(); startTimer(); };
}

function renderGame(){
  const p = PUZZLES[state.idx];
  app.innerHTML = `
  <header class="bar">
    <span class="team">${esc(state.team || 'Player')}</span>
    <span class="clock ${!state.clockOff && remaining()<=60 ? 'low':''}" id="clock" role="timer">${clockText()}</span>
    <span class="hc">Hints used: <b id="hc">${state.hintsUsed}</b></span>
  </header>
  <div class="tape" aria-hidden="true"></div>
  <div class="wrap">
    <div class="scene-box">${sceneSvg()}</div>
    <div class="game">
      <nav class="rack" aria-label="Escape route progress">${rackHtml()}</nav>
      <section class="panel" aria-labelledby="ptitle">
        <p class="lock-of">Lock ${state.idx+1} of ${PUZZLES.length}</p>
        <h2 id="ptitle">${p.title}</h2>
        <p class="story">${p.story}</p>
        <div id="puzzle">${p.html()}</div>
        <p class="feedback" id="fb" role="status" aria-live="polite"></p>
        <div class="hints" id="hints">${hintsHtml()}</div>
      </section>
    </div>
    ${hostHtml()}
  </div>`;
  applyLevel();
  p.bind(); bindHints();
  $('#ptitle').setAttribute('tabindex','-1'); $('#ptitle').focus({preventScroll:true}); window.scrollTo({top:0});
}

function solve(){
  state.solved[state.idx] = true;
  fb(state.idx === PUZZLES.length - 1 ? 'The hatch is open!' : 'Lock cracked! The next vent section is open.', 'good');
  $('.rack').innerHTML = rackHtml();
  $$('#puzzle button, #puzzle input, #puzzle select').forEach(el => el.disabled = true);
  state.paused = true;
  setTimeout(() => {
    state.paused = false;
    if (state.idx === PUZZLES.length - 1) return renderWin();
    state.idx++; renderGame(); window.scrollTo({top:0});
  }, 1300);
}

function renderWin(){
  stopTimer();
  const used = state.elapsed + state.penalty;
  const left = state.clockOff ? 0 : remaining();
  app.innerHTML = `<div class="tape" aria-hidden="true"></div>
  <div class="wrap"><section class="end">
    <h1>You escaped!</h1>
    <p class="lede">${esc(state.team || 'You')} crawled out through the vents ${state.clockOff ? 'after the barricade fell, but made it out anyway' : `with ${fmt(left)} left before the barricade gave out`}. That took real IT skills: diagnosing hardware, knowing your ports, closing tickets, decoding binary, and spotting attacks.</p>
    <div class="stats">
      <div><b>${fmt(used)}</b><span>total time</span></div>
      <div><b>${state.hintsUsed}</b><span>hints used</span></div>
      <div><b>${state.wrong}</b><span>zombie surges</span></div>
    </div>
    <button class="btn" id="again">Play again</button>
  </section>
  ${hostHtml()}</div>`;
  $('#again').onclick = renderIntro;
  submitResult(used);
}

/* Leaderboard hookup: add a Google Form's formResponse URL and field IDs to turn this on. */
const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSekzxrNDtjrOh6Ur84xWP48dQyMm4WH9aPcEdiGeF3zHoA6kg/formResponse';
const FIELDS = { team:'entry.930780214', time:'entry.1417165640', hints:'entry.38312738', surges:'entry.1019665911' };
function submitResult(sec){
  if (!FORM_URL) return;
  sec = Math.max(0, Math.round(sec));
  const time = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  const body = new URLSearchParams({ [FIELDS.team]: state.team || 'Unnamed player', [FIELDS.time]: time, [FIELDS.hints]: String(state.hintsUsed), [FIELDS.surges]: String(state.wrong) });
  try { fetch(FORM_URL, { method:'POST', mode:'no-cors', body }).catch(()=>{}); } catch(e) {}
}

function timeUp(){
  state.paused = true;
  applyLevel(4);
  if ($('.overlay')) return;
  document.body.insertAdjacentHTML('beforeend', `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="tu">
    <div class="panel"><h2 id="tu">The barricade broke!</h2>
      <p>The zombies got in. You cracked ${state.solved.filter(Boolean).length} of ${PUZZLES.length} locks before the door gave way.</p>
      <div class="row"><button class="btn" id="keep">Keep going without the clock</button><button class="btn ghost" id="restart">Start over</button></div>
    </div></div>`);
  $('#keep').focus();
  $('#keep').onclick = () => {
    $('.overlay').remove(); state.clockOff = true; state.paused = false;
    refreshClock(); $('#hints').innerHTML = hintsHtml(); bindHints();
  };
  $('#restart').onclick = () => { $('.overlay').remove(); renderIntro(); };
}

window.addEventListener('hashchange', () => {
  const h = $('.host'); if (h) h.remove();
  const w = $$('.wrap').pop(); if (w && location.hash === '#host') w.insertAdjacentHTML('beforeend', hostHtml());
});

bindTilt();
renderIntro();
</script>
</body>
