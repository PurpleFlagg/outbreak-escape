<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outbreak: IT Room, a Zombie IT Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1010; --panel:#121918; --panel-2:#18211f; --line:#2a3632; --ink:#EEF3EC; --muted:#A9B5AE;
  --green:#A5FF3F; --yellow:#FFC928; --red:#E53935; --orange:#E0812E; --on-bright:#0B1010; --focus:#FFC928;
  --display:"Creepster","Chakra Petch",fantasy,sans-serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(17px,0.6vw + 14px,20px);line-height:1.5;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
p{margin:0 0 1em;max-width:62ch}
.wrap{max-width:980px;margin:0 auto;padding:0 clamp(14px,3vw,32px) clamp(24px,4vw,48px)}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 16px,#111 16px 32px)}
.sr{position:absolute;left:-9999px}

/* buttons */
.btn{font-family:var(--ui);font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:48px;padding:.6em 1.3em;border-radius:10px;border:2px solid var(--yellow);background:var(--yellow);color:var(--on-bright);cursor:pointer}
.btn.ghost{background:transparent;color:var(--yellow)}
.btn.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;min-height:60px;font-size:1.2em;background:var(--green);border-color:var(--green);box-shadow:0 0 22px rgba(165,255,63,.45),inset 0 -4px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.snd{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:700;font-size:.82em;padding:.35em .85em;min-height:36px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);color:var(--ink);cursor:pointer}
.snd svg{width:18px;height:18px}

/* stage: scene + fog + smoke + hands */
.stage{position:relative;overflow:hidden;background:#070909;--tx:0;--ty:0;perspective:900px}
.stage .scene{display:block;width:100%;height:clamp(230px,46vw,460px);transform:scale(1.06) rotateY(calc(var(--tx) * 2.5deg)) rotateX(calc(var(--ty) * -2deg));transition:transform .25s ease-out}
.stage.small .scene{height:clamp(150px,26vw,250px)}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.fog,.smoke{position:absolute;inset:0;pointer-events:none}
.fog i{position:absolute;width:120%;height:60%;left:-10%;bottom:-6%;background:radial-gradient(ellipse at center,rgba(190,205,195,.16),transparent 62%);animation:drift 26s ease-in-out infinite alternate}
.fog i:nth-child(2){bottom:12%;opacity:.7;animation-duration:34s;animation-direction:alternate-reverse}
.smoke{background:radial-gradient(ellipse 38% 55% at 0% 100%,rgba(229,57,53,.42),transparent 70%),radial-gradient(ellipse 38% 55% at 100% 100%,rgba(229,57,53,.42),transparent 70%)}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.zhand{position:absolute;bottom:-4px;width:clamp(70px,16vw,150px);filter:drop-shadow(0 0 10px rgba(229,57,53,.75));z-index:1}
.zhand.l{left:-6px;transform:rotate(14deg)}
.zhand.r{right:-6px;transform:scaleX(-1) rotate(14deg)}
.zhand svg{display:block;width:100%;height:auto;animation:reach 3.2s ease-in-out infinite}
.zhand.r svg{animation-delay:-1.4s}
@keyframes reach{0%,100%{transform:translateY(6%)}50%{transform:translateY(0)}}

/* scene internals */
.scene .c1,.scene .c2,.scene .c3,.scene .hole,.scene .hand{opacity:0;transition:opacity .8s}
.l1 .c1{opacity:1}.l2 .c2,.l2 .h1{opacity:1}.l3 .c3,.l3 .h2{opacity:1}.l4 .hole,.l4 .hand{opacity:1}
.leak{opacity:.25;transition:opacity 1s}.l1 .leak{opacity:.45}.l2 .leak{opacity:.7}.l3 .leak{opacity:1}
.grab{transform-box:fill-box;transform-origin:50% 100%;animation:grab 1.4s ease-in-out infinite}.h2 .grab{animation-delay:.5s}
@keyframes grab{0%,100%{transform:rotate(-7deg) translateY(0) scale(1)}50%{transform:rotate(8deg) translateY(-5px) scale(1.06)}}
.shuffle{animation:shuffle 6s ease-in-out infinite}.shuffle.s2{animation-duration:8.5s;animation-delay:-3s}
@keyframes shuffle{0%,100%{transform:translateX(-14px)}50%{transform:translateX(16px)}}
.eyes{animation:blinkeye 4s infinite}.eyes.e2{animation-duration:5.3s;animation-delay:-2s}
@keyframes blinkeye{0%,92%,100%{opacity:1}95%{opacity:0}}
.swing{transform-box:view-box;transform-origin:400px 0px;animation:swing 4.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.lamp,.lamp-cone{animation:lampflick 7s infinite}
@keyframes lampflick{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}
.mote{animation:mote 9s linear infinite}
.mote:nth-child(2){animation-delay:-2s}.mote:nth-child(3){animation-delay:-4s}.mote:nth-child(4){animation-delay:-6s}.mote:nth-child(5){animation-delay:-7.5s}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(18px,-60px);opacity:0}}
.door-g{transform-box:fill-box;transform-origin:50% 60%}
.l2 .shake{animation:shake 1.8s infinite}.l3 .shake{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1.5px,0)}80%{transform:translate(1.5px,1px)}}
.alarm{opacity:0}.l3 .alarm{animation:alarm 1.2s infinite}
@keyframes alarm{0%,100%{opacity:0}50%{opacity:.22}}
.flicker{opacity:0}.l3 .flicker{animation:flicker 3.1s infinite}
@keyframes flicker{0%,88%,100%{opacity:0}90%{opacity:.75}92%{opacity:.1}94%{opacity:.6}}
.surge .door-g{animation:bulge .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bulge{0%{transform:scale(1)}30%{transform:scale(1.07) translateY(-2px)}60%{transform:scale(.98)}100%{transform:scale(1)}}
.flash,.dust{opacity:0}.surge .flash{animation:flash .6s}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.surge .dust{animation:dust 1.1s ease-in forwards}
@keyframes dust{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(6px,200px)}}

/* landing title */
.hero-title{position:relative;z-index:2;text-align:center;margin-top:clamp(-90px,-9vw,-40px);padding:0 12px}
h1,.creep{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--green);letter-spacing:.02em;
  text-shadow:0 0 18px rgba(165,255,63,.5),0 3px 0 #1d3a0b,0 6px 14px rgba(0,0,0,.8)}
h1{font-size:clamp(2.5rem,11.5vw,6rem);line-height:.95;margin:0;text-wrap:balance}
.edition{display:inline-block;margin:.5em 0 0;font-family:var(--ui);font-weight:700;font-size:clamp(1.05rem,3.6vw,1.6rem);color:var(--on-bright);background:var(--yellow);padding:.2em 1.1em;transform:rotate(-2deg);
  clip-path:polygon(2% 12%,8% 0,30% 6%,55% 0,80% 5%,98% 0,100% 40%,97% 70%,100% 100%,75% 94%,50% 100%,25% 95%,4% 100%,0 60%);max-width:none}
.lede{font-size:1.12em;margin:1.2em auto 1em;text-align:center}
.rules{display:grid;gap:8px;margin:0 auto 1.4em;padding:0;list-style:none;max-width:560px}
.rules li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.rules li::before{content:"";flex:none;width:10px;height:10px;margin-top:.5em;background:var(--yellow);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.setup{display:grid;gap:14px;max-width:520px;margin:0 auto}
.setup label.field{display:grid;gap:6px;font-family:var(--ui);font-weight:700}
.setup input[type=text]{min-height:48px;padding:.55em .8em;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:17px}
.setup input[type=text]:focus{border-color:var(--green)}
.err{color:#ff8a80;font-weight:700;margin:0;min-height:1.3em}
.mode{border:0;padding:0;margin:0;display:grid;gap:10px}
.mode legend{font-family:var(--ui);font-weight:700;padding:0;margin-bottom:6px}
.mode label{display:flex;align-items:center;gap:12px;min-height:58px;padding:.6em .9em;border-radius:10px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.mode label:has(input:checked){border-color:var(--green);box-shadow:0 0 14px rgba(165,255,63,.25)}
.mode input{width:22px;height:22px;accent-color:var(--green);flex:none}
.mode b{display:block;font-family:var(--ui)}
.mode small{color:var(--muted);font-size:.85em}
.time-note{text-align:center;color:var(--muted);margin:0 auto}
.time-note b{color:var(--yellow)}
.go-row{display:grid;justify-items:center;gap:12px;margin-top:4px}

/* hex locks */
.hexes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,1.5vw,14px);max-width:640px;margin:1.2em auto 0;padding:0;list-style:none}
.hexw{position:relative;display:grid;justify-items:center;gap:6px;text-align:center}
.hex{width:100%;max-width:104px;aspect-ratio:.88;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(255,201,40,.38);padding:2.5px;transition:background .3s}
.hex-in{width:100%;height:100%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0e1414;display:grid;place-items:center;color:rgba(255,201,40,.45)}
.hex-in svg{width:46%;height:auto}
.hex-l{hyphens:manual;overflow-wrap:break-word;font-family:var(--ui);font-weight:600;font-size:clamp(11px,2.9vw,14px);line-height:1.15;color:var(--muted);text-wrap:balance}
.hex-n{font-family:var(--ui);font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.08em}
.hexw.active{filter:drop-shadow(0 0 8px rgba(255,201,40,.7));animation:hexglow 1.8s ease-in-out infinite}
.hexw.active .hex{background:var(--yellow)}
.hexw.active .hex-in{color:var(--yellow);background:#16170e}
.hexw.active .hex-l{color:var(--ink)}
.hexw.done{filter:drop-shadow(0 0 8px rgba(165,255,63,.55))}
.hexw.done .hex{background:var(--green)}
.hexw.done .hex-in{color:var(--green);background:#111a0c}
.hexw.done .hex-l{color:var(--green)}
.hexw .tick{position:absolute;top:-2px;right:8%;width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--on-bright);display:grid;place-items:center;box-shadow:0 0 8px rgba(165,255,63,.8)}
.hexw .tick svg{width:14px;height:14px}
.hexw.bad .hex{background:var(--red)}
.hexw.bad{animation:hexbad .5s;filter:drop-shadow(0 0 10px rgba(229,57,53,.9))}
.hexw.pop .hex{animation:pop .55s cubic-bezier(.2,.9,.3,1.5)}
@keyframes hexglow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,201,40,.55))}50%{filter:drop-shadow(0 0 14px rgba(255,201,40,.95))}}
@keyframes hexbad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.game .hexes{margin:14px auto 0}
.game .hex{max-width:72px}

/* game bar + panel */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(5,8,8,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:8px clamp(12px,3vw,32px);flex-wrap:wrap}
.bar .team{font-family:var(--ui);font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-family:var(--ui);font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--yellow);text-shadow:0 0 12px rgba(255,201,40,.45);line-height:1}
.clock.low{color:var(--red);text-shadow:0 0 12px rgba(229,57,53,.7);animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{opacity:.6}}
.bar-r{display:flex;align-items:center;gap:12px}
.bar .hc{font-family:var(--ui);color:var(--muted);font-size:.85em}
.bar .hc b{color:var(--ink)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,32px);margin-top:16px}
.panel.flash{animation:panelbad .6s}
@keyframes panelbad{0%{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.5),inset 0 0 40px rgba(229,57,53,.25)}100%{border-color:var(--line);box-shadow:none}}
.kicker{font-family:var(--ui);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-size:.82em;margin:0 0 .3em}
h2{font-family:var(--ui);font-weight:700;font-size:clamp(1.45rem,4.2vw,2.1rem);line-height:1.15;margin:0 0 .4em;color:var(--ink)}
.story{color:var(--muted)}
.feedback{min-height:1.6em;font-weight:700;margin:1em 0 .5em;font-family:var(--ui)}
.feedback.bad{color:#ff8a80}
.feedback.good{color:var(--green)}
.hints{border-top:1px dashed var(--line);margin-top:1em;padding-top:1em}
.hints ul{margin:.8em 0 0;padding-left:1.2em}
.hints li{margin-bottom:.4em;color:var(--muted)}

/* answer buttons */
.quiz{display:grid;gap:22px;margin:0 0 1.4em;padding:0;list-style:none}
.q-t{display:flex;gap:10px;margin:0 0 10px;font-weight:700}
.q-n{flex:none;font-family:var(--ui);width:1.7em;height:1.7em;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--yellow);display:grid;place-items:center;font-size:.85em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:.55em .8em;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;line-height:1.25;font-size:.95em}
.opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opt[aria-checked="true"]{border-color:var(--green);background:#16220f;box-shadow:0 0 12px rgba(165,255,63,.25)}
.opt[aria-checked="true"]::before{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px #16220f}
.opt:disabled{cursor:default}
.q.missing .q-t{color:#ff8a80}

/* ports matching (A+) */
.match{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-bottom:1.2em}
.match h3{font-family:var(--ui);font-size:.9em;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px;color:var(--yellow)}
.col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;min-height:52px;padding:.55em .8em;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;display:flex;gap:10px;align-items:center;line-height:1.25}
.tile.sel{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,201,40,.35)}
.port{font-family:var(--ui);font-weight:700;font-size:1.1em}
.badge{font-family:var(--ui);font-weight:700;min-width:1.8em;height:1.8em;border-radius:6px;display:inline-grid;place-items:center;background:#16220f;color:var(--green);border:1px solid var(--green);flex:none}
.badge.empty{color:var(--muted);border-color:var(--line);background:var(--panel)}

/* binary */
.radio-msg{background:#070b0a;color:var(--green);font-family:var(--ui);font-weight:600;border-radius:10px;padding:14px 16px;margin:.2em 0 1.2em;border:1.5px solid #233a1a;overflow-x:auto;box-shadow:inset 0 0 24px rgba(165,255,63,.08)}
.radio-msg small{display:block;color:var(--muted);font-weight:500;margin-bottom:6px}
.radio-msg .bits{font-size:clamp(1.05rem,4.4vw,1.9rem);white-space:nowrap;letter-spacing:.04em;text-shadow:0 0 8px rgba(165,255,63,.5)}
.decoder{border:1.5px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:1.4em;overflow-x:auto}
.decoder p{margin:0 0 .6em}
.bitrow{display:flex;gap:6px;align-items:end}
.bit{display:grid;gap:4px;justify-items:center}
.bit small{color:var(--muted);font-weight:700;font-size:.75em}
.bit button{width:2.2em;height:2.4em;border-radius:8px;border:2px solid var(--line);background:var(--panel-2);font-family:var(--ui);font-weight:700;cursor:pointer}
.bit button[aria-pressed="true"]{background:var(--green);color:var(--on-bright);border-color:var(--green);box-shadow:0 0 10px rgba(165,255,63,.5)}
.eq{font-family:var(--ui);font-size:1.4em;font-weight:700;margin-left:6px;white-space:nowrap;color:var(--yellow)}
.keypad{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.keypad input{width:11em;max-width:100%;min-height:52px;padding:.4em .6em;font-family:var(--ui);font-size:1.3em;font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--panel-2)}
.keypad input:focus{border-color:var(--green)}

/* victory + overlay */
.end{text-align:center}
.win-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:clamp(-80px,-8vw,-36px);position:relative;z-index:2}
.win-head .creep{font-size:clamp(2.6rem,12vw,6rem);line-height:.95;margin:0}
.win-head svg{width:clamp(48px,11vw,96px);height:auto;flex:none;filter:drop-shadow(0 0 8px rgba(165,255,63,.5))}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:520px;margin:1.2em auto 1.4em}
.stats div{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;display:grid;gap:2px}
.stats b{font-family:var(--ui);font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.1;color:var(--yellow)}
.stats span{color:var(--muted);font-size:.8em}
.overlay{position:fixed;inset:0;background:rgba(40,4,4,.78);display:grid;place-items:center;z-index:20;padding:20px}
.overlay .panel{max-width:540px;border-color:var(--red);box-shadow:0 0 40px rgba(229,57,53,.45);margin:0}
.overlay h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2.2rem,8vw,3.4rem);color:var(--red);margin:0 0 .2em;text-shadow:0 0 14px rgba(229,57,53,.6)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.host{margin-top:28px;text-align:left}
.host summary{cursor:pointer;font-weight:700}
.host ol{padding-left:1.3em}

@media (max-width:600px){
  .match{grid-template-columns:1fr}
  .game .hex-l{display:none}
  .opts{grid-template-columns:minmax(0,1fr)}
  .opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage .scene{transform:none}
  .l3 .alarm{opacity:.18}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const DURATION = 600, WRONG_COST = 15, HINT_COST = 60;
const state = { mode:'solo', team:'', elapsed:0, penalty:0, idx:0, solved:[], hintsUsed:0, wrong:0, hintsShown:{}, timer:null, paused:false, clockOff:false };

/* ---------- The door ---------- */
function sceneSvg(){
  const hand = cls => `<g class="hand ${cls}"><g class="grab" filter="url(#soft)">
    <path d="M-12 46 L-15 18 Q-16 4 -6 2 L8 2 Q17 5 15 18 L13 46 Z" fill="url(#skin)"/>
    <path d="M-13 30 L13 30 L13 46 L-12 46 Z" fill="#3b2f33" opacity=".85"/>

function bindTilt(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || window.__tiltBound) return;
  window.__tiltBound = true;
  const set = (x, y) => { const b = $('.scene-box'); if (!b) return; b.style.setProperty('--tx', x.toFixed(3)); b.style.setProperty('--ty', y.toFixed(3)); };
  window.addEventListener('pointermove', e => set((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1), { passive:true });
  window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; set(Math.max(-1, Math.min(1, e.gamma / 25)), Math.max(-1, Math.min(1, (e.beta - 45) / 25))); }, { passive:true });
}
function level(){
  if (state.clockOff) return 4;
  const used = (state.elapsed + state.penalty) / DURATION;
  return used >= 1 ? 4 : used >= .9 ? 3 : used >= .6 ? 2 : used >= .3 ? 1 : 0;
}
function applyLevel(l = level()){
  const box = $('.scene-box'); if (!box) return;
  for (let i = 1; i <= 4; i++) box.classList.toggle('l' + i, l >= i);
}

/* ---------- Helpers ---------- */
function fb(msg, kind){ const el = $('#fb'); if (!el) return; el.textContent = msg; el.className = 'feedback ' + (kind || ''); }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function remaining(){ return DURATION - state.elapsed - state.penalty; }
function clockText(){ return state.clockOff ? fmt(state.elapsed + state.penalty) : fmt(remaining()); }
function refreshClock(){
  const c = $('#clock'); if (!c) return;
  c.textContent = clockText(); c.classList.toggle('low', !state.clockOff && remaining() <= 60);
  const l = level(); applyLevel(l);
  if (l !== state.lastLevel) { state.lastLevel = l; Sound.setLevel(l); }
}
function wrong(msg){
  state.wrong++;
  if (!state.clockOff) state.penalty += WRONG_COST;
  fb(msg + (state.clockOff ? '' : ` (−${WRONG_COST} seconds)`), 'bad');
  surge(); refreshClock();
  if (!state.clockOff && remaining() <= 0) timeUp();
}

function startTimer(){
  stopTimer();
  state.timer = setInterval(() => {
    if (state.paused) return;
    state.elapsed++;
    refreshClock();
    if (!state.clockOff && remaining() <= 0) timeUp();
  }, 1000);
}
function stopTimer(){ if (state.timer) clearInterval(state.timer); state.timer = null; }

function bindHints(){
  const b = $('#hint'); if (!b) return;
  b.onclick = () => {
    state.hintsShown[state.idx] = (state.hintsShown[state.idx] || 0) + 1;
    state.hintsUsed++;
    if (!state.clockOff) state.penalty += HINT_COST;
    $('#hc').textContent = state.hintsUsed;
    refreshClock();
    $('#hints').innerHTML = hintsHtml(); bindHints();
    if (!state.clockOff && remaining() <= 0) timeUp();
  };
}

  <header class="bar">
    <span class="team">${esc(state.team || (UI.modes && state.mode === 'solo' ? 'Player' : 'Team'))}</span>
    <span class="clock ${!state.clockOff && remaining()<=60 ? 'low':''}" id="clock" role="timer">${clockText()}</span>
    <span class="bar-r"><span class="hc">Hints <b id="hc">${state.hintsUsed}</b></span>${soundBtn()}</span>
  </header>
  <div class="tape" aria-hidden="true"></div>
  <div class="game">
    ${stageHtml('small', false)}
    <div class="wrap">
      <div id="track">${hexesHtml()}</div>
      <section class="panel play" aria-labelledby="ptitle">
        <p class="kicker">Lock 0${state.idx+1} of 0${PUZZLES.length} · ${UI.labels[state.idx]}</p>
        <h2 id="ptitle">${p.title}</h2>
        <p class="story">${p.story}</p>
        <div id="puzzle">${p.html()}</div>
        <p class="feedback" id="fb" role="status" aria-live="polite"></p>
        <div class="hints" id="hints">${hintsHtml()}</div>
      </section>
      ${hostHtml()}
    </div>
  </div>`;
  applyLevel();
  p.bind(); bindHints(); bindSound();
  $('#ptitle').setAttribute('tabindex','-1'); $('#ptitle').focus({preventScroll:true}); window.scrollTo({top:0});
}

function solve(){
  state.solved[state.idx] = true;
  fb(state.idx === PUZZLES.length - 1 ? 'The hatch is open!' : 'Lock cracked! The next vent section is open.', 'good');
  const done = state.idx;
  $('#track').innerHTML = hexesHtml();
  const hx = $(`.hexw[data-i="${done}"]`); if (hx) hx.classList.add('pop');
  $$('#puzzle button, #puzzle input, #puzzle select').forEach(el => el.disabled = true);
  state.paused = true;
  setTimeout(() => {
    state.paused = false;
    if (state.idx === PUZZLES.length - 1) return renderWin();
    state.idx++; renderGame(); window.scrollTo({top:0});
  }, 1300);
}

function renderWin(){
  stopTimer();
  const used = state.elapsed + state.penalty;
  const left = state.clockOff ? 0 : remaining();
  const solo = UI.modes && state.mode === 'solo';
  app.innerHTML = `<div class="tape" aria-hidden="true"></div>
  <section class="end">
    ${stageHtml('', false)}
    <div class="win-head">${handSvg(true)}<h1 class="creep">You escaped!</h1></div>
    <div class="wrap">
      <p class="lede">${state.clockOff ? `The barricade fell, but ${esc(state.team || 'you')} still cracked all five locks and crawled out through the vents!` : `${state.team ? esc(state.team) + ', you' : 'You'} cracked all five locks and made it out before the zombies broke through, with ${fmt(left)} to spare!`}</p>
      ${hexesHtml(PUZZLES.map(() => 'done'))}
      <div class="stats">
        <div><b>${fmt(used)}</b><span>total time</span></div>
        <div><b>${state.hintsUsed}</b><span>hints used</span></div>
        <div><b>${state.wrong}</b><span>zombie surges</span></div>
      </div>
      ${solo ? '<p class="time-note"><b>Hold up your phone to show your time.</b> Fastest escape in the class wins!</p>' : ''}
      <div class="go-row"><button class="btn go" id="again">Play again</button></div>
      ${hostHtml()}
    </div>
  </section>`;
  $('#again').onclick = renderIntro;
  Sound.escape();
  submitResult(used);
}

function timeUp(){
  state.paused = true;
  applyLevel(4);
  if ($('.overlay')) return;
  Sound.breach();
  document.body.insertAdjacentHTML('beforeend', `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="tu">
    <div class="panel"><h2 id="tu">The barricade broke!</h2>
      <p>The zombies got in. You cracked ${state.solved.filter(Boolean).length} of ${PUZZLES.length} locks before the door gave way.</p>
      <div class="row"><button class="btn" id="keep">Keep going without the clock</button><button class="btn ghost" id="restart">Start over</button></div>
    </div></div>`);
  $('#keep').focus();
  $('#keep').onclick = () => {
    $('.overlay').remove(); state.clockOff = true; state.paused = false;
    refreshClock(); $('#hints').innerHTML = hintsHtml(); bindHints();
  };
  $('#restart').onclick = () => { $('.overlay').remove(); renderIntro(); };
}

bindTilt();
renderIntro();
</script>
</body>
</html>
